version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asistente-escolar-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistente_escolar_ia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistente_escolar_ia >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    container_name: asistente-escolar-ia-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/docs', timeout=2)\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

  telegram-bot:
    build: ./backend
    container_name: asistente-escolar-ia-telegram-bot
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - BACKEND_URL=http://backend:8000/api/v1/messages
      - TELEGRAM_OFFSET_FILE=/data/.telegram_offset.json
    volumes:
      - telegram_data:/data
    command: python /app/telegram_bot.py
    depends_on:
      backend:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: asistente-escolar-ia-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  hf_cache:
  telegram_data:
