version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asistente-escolar-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistente_escolar_ia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  ollama:
    image: ollama/ollama:latest
    container_name: asistente-escolar-ia-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: asistente-escolar-ia-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/asistente_escolar_ia
      - HF_HOME=/cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/cache/huggingface
      - TOKENIZERS_PARALLELISM=false

      - LLM_PROVIDER=ollama
      - LLM_PROVIDER_CHAIN=ollama,openai,gemini
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - LLM_TIMEOUT_S=180
      - OLLAMA_TIMEOUT_S=180
      - OPENAI_TIMEOUT_S=45
      - GEMINI_TIMEOUT_S=45
      - GEMINI_MODEL_NAME=gemini-2.0-flash
      - RAG_ENABLED=false

    depends_on:
      - db
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache
      - hf_cache:/cache/huggingface

  adminer:
    image: adminer
    container_name: asistente-escolar-ia-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  ollama:
  hf_cache:
