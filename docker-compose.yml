version: "3.9"

services:
  db:
    image: postgres:16
    container_name: asistente-escolar-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistente_escolar_ia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    container_name: asistente-escolar-ia-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  adminer:
    image: adminer
    container_name: asistente-escolar-ia-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

# El script init.sql se ejecuta solo la primera vez que se crea la BD (si borras ./db/data, se vuelve a ejecutar).
# Adminer es un mini-panel web para ver la BD en http://localhost:8080 (servidor: db, usuario postgres, pass postgres, 
# BD asistente_escolar_ia).
